services:
  - type: pserv
    name: bookstore-mysql
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Backend/Database/Dockerfile
    dockerContext: .
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: bookstore_management
      - key: MYSQL_USER
        value: bookstore_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: bookstore-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://bookstore-api-1y53.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: bookstore-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Backend/API/Dockerfile
    dockerContext: .
    healthCheckPath: /health.php
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: bookstore-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: bookstore_management
      - key: DB_USER
        value: bookstore_app
      - key: DB_PASS
        fromService:
          type: pserv
          name: bookstore-mysql
          envVarKey: MYSQL_PASSWORD
