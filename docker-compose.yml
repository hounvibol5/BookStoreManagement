services:
  api:
    build:
      context: .
      dockerfile: Backend/API/Dockerfile
    ports:
      - "8000:10000"
    environment:
      PORT: "10000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: bookstore_management
      DB_USER: bookstore_app
      DB_PASS: bookstore_pass
    volumes:
      - ./Backend/API:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: bookstore_management
      MYSQL_USER: bookstore_app
      MYSQL_PASSWORD: bookstore_pass
    ports:
      - "3307:3306"
    volumes:
      - bookstore_mysql_data:/var/lib/mysql
      - ./Backend/Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bookstore_mysql_data:
